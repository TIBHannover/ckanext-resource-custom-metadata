<button type="button" class="btn btn-primary" data-toggle="modal" data-target="{{'#resourcesModal_' ~ metadata_field_name  ~ counter_id}}">
  {{_('Select data resource')}}
</button>
<div id="{{'resourcesModal_' ~ metadata_field_name  ~ counter_id}}" class="modal fade" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">{{metadata_field_title}}: <div>XXXX</div> </h4>
      </div>
      <div class="modal-body">  
        <b><i>
          <p>{{_('Please select the data resource(s) for this ') ~ metadata_field_title }}</p>
        </i></b>
        <label class="checkbox-container">{{_('Select All')}}
            <input type="checkbox" class="select-all-resources" id={{'select-all-resources-' ~ metadata_field_name ~ counter_id}}>
            <span class="checkmark"></span>
        </label>
          <br>
        <div class="resources-list-box">
          {% for res in resources %}
            <label class="checkbox-container" value={{res.id}} id="{{'resource-checkbox-input-label-' ~ metadata_field_name ~ counter_id}}">
                {{res.name}}
                <input type="checkbox" 
                  class="{{'resource-checkbox-input-' ~ metadata_field_name ~ counter_id}}  resource-box"
                  id="{{res.id ~ '@@@' ~ metadata_field_name ~ counter_id}}"
                  name={{'custom_metadata_' ~ metadata_field_name}} 
                  value={{res.id}}
                  >
                <span class="checkmark"></span>
            </label>
          {% endfor %}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id={{'ref_modal_add_btn' ~ counter_id}} class="btn btn-primary refModalAdd" data-dismiss="modal">{{_('Save')}}</button>
        <button type="button" id={{'ref_add_close_btn' ~ counter_id}} type="button" class="pull-left btn btn-default refModalClose" data-dismiss="modal">{{_('Close')}}</button>
      </div>
    </div>

  </div>
</div>
